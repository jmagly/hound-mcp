# CodeHound MCP Docker Compose
# Development and testing configuration

services:
  #============================================================================
  # Production service
  #============================================================================
  codehound:
    build:
      context: .
      target: production
    image: jmagly/codehound-mcp:latest
    container_name: codehound-mcp
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - HOUND_URL=${HOUND_URL:-http://hound:6080}
      - HOUND_TIMEOUT=${HOUND_TIMEOUT:-30000}
      - GITEA_URL=${GITEA_URL:-}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - GITHUB_URL=${GITHUB_URL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - MCP_PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Uncomment to add Hound service
    # depends_on:
    #   - hound

  #============================================================================
  # Test runner - runs all tests in container
  #============================================================================
  test:
    build:
      context: .
      target: test
    image: jmagly/codehound-mcp:test
    container_name: codehound-mcp-test
    profiles:
      - test
    # Test stage runs tests during build, so this just validates the build

  #============================================================================
  # Development with live reload
  #============================================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: codehound-mcp-dev
    profiles:
      - dev
    ports:
      - "3100:3000"
    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
    environment:
      - HOUND_URL=${HOUND_URL:-http://localhost:6080}
      - GITEA_URL=${GITEA_URL:-}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - GITHUB_URL=${GITHUB_URL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    command: ["npm", "run", "dev"]

  #============================================================================
  # Optional: Hound service for local development
  #============================================================================
