name: Internal release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: '24'
  REGISTRY: git.integrolabs.net
  IMAGE: roctinam/hound-mcp
  NPM_REGISTRY: https://git.integrolabs.net/api/packages/roctinam/npm/
jobs:
  verify:
    runs-on: teroknor
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb # node 24.15.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - run: npm install --global npm@11.6.2
      - name: Verify release input
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends gnupg
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tools/ci/verify-signed-tag.sh "$RELEASE_TAG"
          test "${GITHUB_REF#refs/tags/v}" = "$(node -p "require('./package.json').version")"
          npm ci
          npm run check
  publish-npm:
    runs-on: teroknor
    needs: verify
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb # node 24.15.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: npm install --global npm@11.6.2
      - name: Install credential helper dependency
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends jq
      - name: Fetch scoped publish credentials
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CACERT: ci/integrolabs-g2-ca-bundle.pem
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          REGISTRY_CREDENTIAL_VAULT_PATH: ${{ vars.REGISTRY_CREDENTIAL_VAULT_PATH }}
          REGISTRY_TOKEN_VAULT_FIELD: ${{ vars.REGISTRY_TOKEN_VAULT_FIELD }}
          REGISTRY_USERNAME_VAULT_FIELD: ${{ vars.REGISTRY_USERNAME_VAULT_FIELD }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.release.spec
      - name: Select channel
        id: channel
        run: |
          case "${GITHUB_REF#refs/tags/v}" in
            *-nightly.*) CHANNEL=nightly ;;
            *-*) CHANNEL=next ;;
            *) CHANNEL=latest ;;
          esac
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Publish internal npm package
        run: |
          npm ci
          npm run build
          printf '%s\n' '//git.integrolabs.net/api/packages/roctinam/npm/:_authToken=${NODE_AUTH_TOKEN}' > /tmp/npmrc
          VERSION="${GITHUB_REF#refs/tags/v}"
          EXPECTED_INTEGRITY="$(npm pack --dry-run --json | jq -r '.[0].integrity')"
          PUBLISHED="$(npm view "hound-search-mcp@$VERSION" dist.integrity \
            --userconfig /tmp/npmrc --registry "$NPM_REGISTRY" 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            test "$PUBLISHED" = "$EXPECTED_INTEGRITY"
          else
            npm publish --userconfig /tmp/npmrc --registry "$NPM_REGISTRY" \
              --provenance=false --tag "${{ steps.channel.outputs.name }}"
          fi
          test "$(npm view "hound-search-mcp@$VERSION" dist.integrity \
            --userconfig /tmp/npmrc --registry "$NPM_REGISTRY")" = "$EXPECTED_INTEGRITY"
  publish-container:
    runs-on: teroknor
    needs: publish-npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Fetch scoped publish credentials
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CACERT: ci/integrolabs-g2-ca-bundle.pem
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          REGISTRY_CREDENTIAL_VAULT_PATH: ${{ vars.REGISTRY_CREDENTIAL_VAULT_PATH }}
          REGISTRY_TOKEN_VAULT_FIELD: ${{ vars.REGISTRY_TOKEN_VAULT_FIELD }}
          REGISTRY_USERNAME_VAULT_FIELD: ${{ vars.REGISTRY_USERNAME_VAULT_FIELD }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.release.spec
      - name: Select channel
        id: channel
        run: |
          case "${GITHUB_REF#refs/tags/v}" in
            *-nightly.*) CHANNEL=nightly ;;
            *-*) CHANNEL=next ;;
            *) CHANNEL=latest ;;
          esac
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Publish container
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          printf '%s' "$NODE_AUTH_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          docker build --target production --tag "$REGISTRY/$IMAGE:$VERSION" .
          docker push "$REGISTRY/$IMAGE:$VERSION"
          if [ "${{ steps.channel.outputs.name }}" = latest ]; then
            docker tag "$REGISTRY/$IMAGE:$VERSION" "$REGISTRY/$IMAGE:latest"
            docker push "$REGISTRY/$IMAGE:latest"
          fi
          docker logout "$REGISTRY"
